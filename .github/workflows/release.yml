name: Installer validation and optional prerelease
on:
  push:
    branches: [release-candidate]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version as a prerelease (never stable)
        type: boolean
        default: false
      test_arm64:
        description: Optional slow best-effort QEMU-user arm64 validation
        type: boolean
        default: false
      vm_faults:
        description: Parallel fresh-VM kill/resume after every actual smoke journal event (expensive)
        type: boolean
        default: false
      vm_security:
        description: Bounded VM scenarios; swap 0/2/4+ GiB, minimum-memory and APT-lock contention
        type: boolean
        default: false
      vm_image_url:
        description: Official Ubuntu 26.04 cloud-image override; empty uses signed Canonical release
        type: string
        default: ''
      vm_image_sha256:
        description: Optional expected image SHA256; signed Canonical sums always checked
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline tests, lint, controlled reproducible export
        run: |
          set -eu
          python3 -B -W error::ResourceWarning -m unittest discover -s tests
          sh -n install.sh
          for script in tools/*.sh; do sh -n "$script"; done
          python3 -B tools/check-syntax.py
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --disable-pip-version-check pyflakes==3.4.0
          "$RUNNER_TEMP/lint-venv/bin/python" -m pyflakes lib tools
          python3 -B release/build.py
          cp release/*.tar.gz "$RUNNER_TEMP/first.tar.gz"
          python3 -B release/build.py
          cmp "$RUNNER_TEMP/first.tar.gz" release/*.tar.gz
          (cd release && sha256sum -c SHA256SUMS)
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf release/*.tar.gz -C "$RUNNER_TEMP/extracted"
          python3 -B -W error::ResourceWarning -m unittest discover -s "$RUNNER_TEMP/extracted/$(python3 -B -c "import sys; sys.path.insert(0,'release'); from build import VERSION; print('universal-linux-installer-'+VERSION)")/tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-candidate
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/manifest.json
            release/AUDIT.txt
            release/build.py
  container-amd64:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real Ubuntu archive resolver and Ubuntu npm9 (all profiles)
        run: sh tools/container-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer2-amd64
          path: /tmp/rc5-layer2.json
          if-no-files-found: warn
  container-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.test_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Best-effort QEMU user arm64
        run: |
          set -eu
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64
          timeout --kill-after=30s 55m docker run --rm --platform linux/arm64 -e RC5_TEST_OUTPUT=/work/layer2-arm64.json -v "$PWD:/work" -w /work ubuntu:26.04 sh tools/container-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer2-arm64-best-effort
          path: layer2-arm64.json
          if-no-files-found: warn
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: [APP, DB, APP+DB]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable local systemd VM acceptance (KVM or TCG)
        env:
          IMAGE_URL: ${{ inputs.vm_image_url }}
          IMAGE_SHA: ${{ inputs.vm_image_sha256 }}
          PROFILE: ${{ matrix.profile }}
          VM_SECURITY: 'false'
        run: sh tools/ci-vm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer3-${{ matrix.profile }}
          path: |
            e2e-logs/status.txt
            e2e-logs/SHA256SUMS
            e2e-logs/signature-status.txt
            e2e-logs/**/serial.log
            e2e-logs/**/artifacts/*
  vm-security:
    if: github.event_name == 'workflow_dispatch' && inputs.vm_security
    needs: [vm]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile: [APP, DB, APP+DB]
        scenario: [swap2, swap4, minimum, low-memory, contention]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable local systemd VM acceptance (KVM or TCG)
        env:
          IMAGE_URL: ${{ inputs.vm_image_url }}
          IMAGE_SHA: ${{ inputs.vm_image_sha256 }}
          PROFILE: ${{ matrix.profile }}
          VM_SECURITY: 'false'
          RC5_E2E_SCENARIO: ${{ matrix.scenario }}
        run: sh tools/ci-vm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer3-security-${{ matrix.profile }}-${{ matrix.scenario }}
          path: |
            e2e-logs/status.txt
            e2e-logs/SHA256SUMS
            e2e-logs/signature-status.txt
            e2e-logs/**/serial.log
            e2e-logs/**/artifacts/*
  vm-fault-matrix:
    if: github.event_name == 'workflow_dispatch' && inputs.vm_faults
    needs: [vm]
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: layer3-*
          path: smoke-evidence
      - id: matrix
        name: Bind every fault job to actual first-run event count
        run: |
          set -eu
          matrix=$(python3 -B tools/make-fault-matrix.py smoke-evidence)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"
  vm-fault:
    if: github.event_name == 'workflow_dispatch' && inputs.vm_faults
    needs: [vm-fault-matrix]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.vm-fault-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable local systemd VM acceptance (KVM or TCG)
        env:
          IMAGE_URL: ${{ inputs.vm_image_url }}
          IMAGE_SHA: ${{ inputs.vm_image_sha256 }}
          PROFILE: ${{ matrix.profile }}
          VM_SECURITY: 'false'
          RC5_E2E_FAULT_EVENT: ${{ matrix.event }}
        run: sh tools/ci-vm.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer3-fault-${{ matrix.profile }}-${{ matrix.event }}
          path: |
            e2e-logs/status.txt
            e2e-logs/SHA256SUMS
            e2e-logs/signature-status.txt
            e2e-logs/**/serial.log
            e2e-logs/**/artifacts/*
  publish:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/release-candidate' && needs.unit.result == 'success' && needs.container-amd64.result == 'success' && needs.vm.result == 'success' && inputs.vm_security && inputs.vm_faults && needs.vm-security.result == 'success' && needs.vm-fault.result == 'success'
    needs: [unit, container-amd64, vm, vm-security, vm-fault]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build version-derived authorized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -B release/build.py
          (cd release && sha256sum -c SHA256SUMS)
          version=$(python3 -B -c "import sys; sys.path.insert(0,'release'); from build import VERSION; print(VERSION)")
          gh release create "v$version" release/*.tar.gz release/SHA256SUMS release/manifest.json release/build.py release/AUDIT.txt --target "$GITHUB_SHA" --title "Universal Linux Installer v$version" --notes-file CHANGELOG.md --prerelease
