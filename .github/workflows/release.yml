name: Installer validation and optional prerelease
on:
  push:
    branches: [release-candidate]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested version as a prerelease (never stable)
        type: boolean
        default: false
      test_arm64:
        description: Optional slow best-effort QEMU-user arm64 validation
        type: boolean
        default: false
      vm_security:
        description: Bounded VM scenarios; swap 0/2/4+ GiB, minimum-memory and APT-lock contention
        type: boolean
        default: false
      vm_matrix:
        description: Full VM swap, minimum-memory, lock contention and every journal-event fault matrix
        type: boolean
        default: false
      vm_image_url:
        description: Official Ubuntu 26.04 cloud-image override; empty uses signed Canonical release
        type: string
        default: ''
      vm_image_sha256:
        description: Optional expected image SHA256; signed Canonical sums always checked
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: false
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Offline tests, lint, controlled reproducible export
        run: |
          set -eu
          python3 -B -W error::ResourceWarning -m unittest discover -s tests
          sh -n install.sh
          for script in tools/*.sh; do sh -n "$script"; done
          python3 -B tools/check-syntax.py
          python3 -m venv "$RUNNER_TEMP/lint-venv"
          "$RUNNER_TEMP/lint-venv/bin/python" -m pip install --disable-pip-version-check pyflakes==3.4.0
          "$RUNNER_TEMP/lint-venv/bin/python" -m pyflakes lib tools
          python3 -B release/build.py
          cp release/*.tar.gz "$RUNNER_TEMP/first.tar.gz"
          python3 -B release/build.py
          cmp "$RUNNER_TEMP/first.tar.gz" release/*.tar.gz
          (cd release && sha256sum -c SHA256SUMS)
          mkdir "$RUNNER_TEMP/extracted"
          tar -xzf release/*.tar.gz -C "$RUNNER_TEMP/extracted"
          python3 -B -W error::ResourceWarning -m unittest discover -s "$RUNNER_TEMP/extracted/$(python3 -B -c "import sys; sys.path.insert(0,'release'); from build import VERSION; print('universal-linux-installer-'+VERSION)")/tests"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reproducible-candidate
          path: |
            release/*.tar.gz
            release/SHA256SUMS
            release/manifest.json
            release/AUDIT.txt
            release/build.py
  container-amd64:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real Ubuntu archive resolver and Ubuntu npm9 (all profiles)
        run: sh tools/container-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer2-amd64
          path: /tmp/rc5-layer2.json
          if-no-files-found: warn
  container-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.test_arm64
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Best-effort QEMU user arm64
        run: |
          set -eu
          docker run --privileged --rm tonistiigi/binfmt:qemu-v9.2.2 --install arm64
          timeout --kill-after=30s 55m docker run --rm --platform linux/arm64 -e RC5_TEST_OUTPUT=/work/layer2-arm64.json -v "$PWD:/work" -w /work ubuntu:26.04 sh tools/container-test.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer2-arm64-best-effort
          path: layer2-arm64.json
          if-no-files-found: warn
  vm:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        profile: [APP, DB, APP+DB]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Disposable local systemd VM acceptance (KVM or TCG)
        env:
          IMAGE_URL: ${{ inputs.vm_image_url }}
          IMAGE_SHA: ${{ inputs.vm_image_sha256 }}
          PROFILE: ${{ matrix.profile }}
          VM_MATRIX: ${{ inputs.vm_matrix }}
          VM_SECURITY: ${{ inputs.vm_security }}
        run: |
          set -eu
          mkdir -p e2e-logs
          IMAGE_URL=${IMAGE_URL:-https://cloud-images.ubuntu.com/releases/resolute/release/ubuntu-26.04-server-cloudimg-amd64.img}
          case "$IMAGE_URL" in https://cloud-images.ubuntu.com/releases/resolute/*/ubuntu-26.04-server-cloudimg-amd64.img|https://cloud-images.ubuntu.com/resolute/*/resolute-server-cloudimg-amd64.img) ;; *) exit 2;; esac
          # Only disposable CI-runner prerequisites; no APP-O or real target changes.
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 -y install qemu-system-x86 qemu-utils cloud-image-utils gpg gpgv
          image_dir="$RUNNER_TEMP/verified-image"
          mkdir -m 700 "$image_dir" "$image_dir/gnupg"
          image_name=${IMAGE_URL##*/}
          image_base=${IMAGE_URL%/*}
          for name in SHA256SUMS SHA256SUMS.gpg; do
            curl -q --fail --location --proto '=https' --proto-redir '=https' "$image_base/$name" -o "$image_dir/$name"
          done
          # Fingerprint pinned from Canonical public-image verification documentation.
          cloud_key=D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81
          curl -q --fail --location --proto '=https' --proto-redir '=https' "https://keyserver.ubuntu.com/pks/lookup?op=get&search=0x$cloud_key" -o "$image_dir/key.asc"
          gpg --batch --homedir "$image_dir/gnupg" --import "$image_dir/key.asc"
          actual_key=$(gpg --batch --homedir "$image_dir/gnupg" --with-colons --fingerprint "$cloud_key" | awk -F: '$1=="fpr" { print $10; exit }')
          [ "$actual_key" = "$cloud_key" ]
          gpg --batch --homedir "$image_dir/gnupg" --export "$cloud_key" > "$image_dir/keyring.gpg"
          gpgv --homedir "$image_dir/gnupg" --keyring "$image_dir/keyring.gpg" --status-fd 1 "$image_dir/SHA256SUMS.gpg" "$image_dir/SHA256SUMS" > "$image_dir/signature-status.txt"
          grep -Eq "^\[GNUPG:\] VALIDSIG $cloud_key " "$image_dir/signature-status.txt"
          verified_sha=$(awk -v file="*$image_name" '$2==file { print $1 }' "$image_dir/SHA256SUMS")
          [ "${#verified_sha}" -eq 64 ]
          [ -z "$IMAGE_SHA" ] || [ "$IMAGE_SHA" = "$verified_sha" ]
          curl -q --fail --location --proto '=https' --proto-redir '=https' "$IMAGE_URL" -o "$image_dir/$image_name"
          printf '%s  %s\n' "$verified_sha" "$image_dir/$image_name" | sha256sum -c -
          cp "$image_dir/SHA256SUMS" "$image_dir/signature-status.txt" e2e-logs/
          export RC5_E2E_IMAGE="$image_dir/$image_name" RC5_E2E_IMAGE_SHA256="$verified_sha" TMPDIR="$PWD/e2e-logs"
          if [ "$VM_MATRIX" = true ]; then export RC5_E2E_MATRIX=1; fi
          if [ "$VM_SECURITY" = true ]; then export RC5_E2E_SECURITY=1; fi
          # Smoke all three profiles with real systemd, TransIP mirror and APP development tools.
          # Full swap/fault matrix remains an explicit separate local harness option.
          sh tools/e2e-vm.sh "$PROFILE" > e2e-logs/status.txt 2>&1
          cat e2e-logs/status.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: layer3-${{ matrix.profile }}
          path: |
            e2e-logs/status.txt
            e2e-logs/SHA256SUMS
            e2e-logs/signature-status.txt
            e2e-logs/**/serial.log
            e2e-logs/**/artifacts/*
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/release-candidate'
    needs: [unit, container-amd64, vm]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build version-derived authorized prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          python3 -B release/build.py
          (cd release && sha256sum -c SHA256SUMS)
          version=$(python3 -B -c "import sys; sys.path.insert(0,'release'); from build import VERSION; print(VERSION)")
          gh release create "v$version" release/*.tar.gz release/SHA256SUMS release/manifest.json release/build.py release/AUDIT.txt --target "$GITHUB_SHA" --title "Universal Linux Installer v$version" --notes-file CHANGELOG.md --prerelease
