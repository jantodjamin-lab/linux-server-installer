{
  "name": "RC3 offline validation and prerelease",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "write"
  },
  "concurrency": {
    "group": "rc3-prerelease",
    "cancel-in-progress": false
  },
  "jobs": {
    "publish": {
      "if": "false",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "steps": [
        {
          "uses": "actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "Offline tests and controlled reproducible export",
          "run": "set -eu\npython3 -B -W error::ResourceWarning -m unittest discover -s tests -v\nsh -n install.sh\npython3 -B release/build.py\ncp release/universal-linux-installer-1.0.0-rc.3.tar.gz \"$RUNNER_TEMP/first.tar.gz\"\npython3 -B release/build.py\ncmp \"$RUNNER_TEMP/first.tar.gz\" release/universal-linux-installer-1.0.0-rc.3.tar.gz\nprintf '%s  %s\\n' 7db205704a4d5adfe18d06b47c824e70767484534c3d848a436340fb58b1df6c release/universal-linux-installer-1.0.0-rc.3.tar.gz | sha256sum -c -\n(cd release && sha256sum -c SHA256SUMS)\nmkdir \"$RUNNER_TEMP/rc3-extracted\"\ntar -xzf release/universal-linux-installer-1.0.0-rc.3.tar.gz -C \"$RUNNER_TEMP/rc3-extracted\"\npython3 -B -W error::ResourceWarning -m unittest discover -s \"$RUNNER_TEMP/rc3-extracted/universal-linux-installer-1.0.0-rc.3/tests\" -v\n"
        },
        {
          "name": "Create only the authorized prerelease",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "set -eu\ngh release create v1.0.0-rc.3 release/universal-linux-installer-1.0.0-rc.3.tar.gz release/SHA256SUMS release/manifest.json release/build.py release/AUDIT.txt --repo jantodjamin-lab/linux-server-installer --target \"$GITHUB_SHA\" --title \"Universal Linux Installer v1.0.0-rc.3\" --notes-file docs/RC3.md --prerelease\n"
        }
      ]
    }
  }
}
