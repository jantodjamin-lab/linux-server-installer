{
  "name": "RC3 anonymous released artifact acceptance",
  "on": {
    "push": {
      "branches": [
        "release-candidate"
      ],
      "paths": [
        ".github/workflows/rc3-verify.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "verify": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 10,
      "steps": [
        {
          "name": "Anonymous HTTPS downloads, pinned checksum and extracted offline tests",
          "run": "set -eu\nverify_dir=$(mktemp -d)\ncd \"$verify_dir\"\nfor asset in universal-linux-installer-1.0.0-rc.3.tar.gz SHA256SUMS manifest.json build.py AUDIT.txt; do\n  curl -q --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 --retry 3 --max-time 60 \"https://github.com/jantodjamin-lab/linux-server-installer/releases/download/v1.0.0-rc.3/$asset\" --output \"$asset\"\ndone\nprintf '%s  %s\\n' 7db205704a4d5adfe18d06b47c824e70767484534c3d848a436340fb58b1df6c universal-linux-installer-1.0.0-rc.3.tar.gz | sha256sum -c -\nsha256sum -c SHA256SUMS\ntar -xzf universal-linux-installer-1.0.0-rc.3.tar.gz\npython3 -B -W error::ResourceWarning -m unittest discover -s universal-linux-installer-1.0.0-rc.3/tests -v\n"
        }
      ]
    }
  }
}
