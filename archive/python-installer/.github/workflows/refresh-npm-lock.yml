name: Refresh reviewed npm metadata (PR only)
on:
  workflow_dispatch:
    inputs:
      angular:
        type: string
        required: true
        description: Explicit Angular 20.x.y version
      codex:
        type: string
        required: true
        description: Explicit Codex x.y.z version
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Generate real npm9 public locks, validate, open review PR
        env:
          ANGULAR_VERSION: ${{ inputs.angular }}
          CODEX_VERSION: ${{ inputs.codex }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          apt-get -o DPkg::Lock::Timeout=600 update
          apt-get -o DPkg::Lock::Timeout=600 --no-remove --no-install-recommends -y install python3 nodejs npm git gh ca-certificates
          python3 -B tools/make-npm-bundle.py --angular "$ANGULAR_VERSION" --codex "$CODEX_VERSION"
          git config --global --add safe.directory "$PWD"
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          branch="refresh-npm-lock-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git add bundle profiles/npm-pins.json
          git diff --cached --quiet && exit 0
          git commit -m 'Refresh explicitly requested public npm integrity locks'
          gh auth setup-git
          git push origin "$branch"
          gh pr create --base release-candidate --head "$branch" --title 'Review explicit npm lock refresh' --body 'Generated from explicitly requested versions with Ubuntu npm9 and scripts disabled. Review public metadata, SRI and compatibility before merging. No automatic merge.'
